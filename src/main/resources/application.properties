spring.application.name=certificate-details-extraction-api
server.port=8080
server.error.include-message=never
server.error.include-stacktrace=never

# Application logging. DEBUG is useful during development; use INFO in production.
logging.level.com.example.certificates=DEBUG
logging.level.org.springframework.web=INFO

# Write application logs to this file as well as the console.
# The existing .gitignore excludes *.log files.
logging.file.name=logs/certificate-api.log
