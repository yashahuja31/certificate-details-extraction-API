openapi: 3.1.0
info:
  title: Certificate Details Extraction API
  version: 1.0.0
  description: Extracts award-certificate fields with PDFBox/OCR and parses X.509 SSL/TLS certificates directly with Java security APIs. No AI service is used.
servers:
  - url: http://localhost:8080
paths:
  /api/certificates/extract:
    post:
      summary: Extract certificate information from Base64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [certificate, fileType]
              properties:
                certificate:
                  type: string
                  description: Base64-encoded file bytes; a data URI prefix is also accepted.
                fileType:
                  type: string
                  enum: [pdf, png, jpg, jpeg, pem, crt, cer, der]
      responses:
        '200':
          description: Extraction completed; missing fields are null and status may be unknown.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      certificateNumber: { type: [string, 'null'] }
                      holderName: { type: [string, 'null'] }
                      certificateName: { type: [string, 'null'] }
                      issuer: { type: [string, 'null'] }
                      issueDate: { type: [string, 'null'], format: date }
                      expiryDate: { type: [string, 'null'], format: date }
                      status: { type: string, enum: [valid, expired, unknown] }
                      certificateType: { type: string, enum: [document, ssl_tls] }
                      x509:
                        oneOf:
                          - type: object
                            properties:
                              serialNumber: { type: string }
                              subject: { type: string }
                              subjectAlternativeNames:
                                type: array
                                items: { type: string }
                              validFrom: { type: string, format: date-time }
                              validUntil: { type: string, format: date-time }
                              signatureAlgorithm: { type: string }
                          - type: 'null' 
        '400':
          description: Invalid request, invalid Base64, unsupported file type, or file signature mismatch.
        '413':
          description: Decoded file exceeds 10 MB.
        '422':
          description: Certificate is unreadable, corrupted, encrypted, or OCR failed.
        '500':
          description: Unexpected processing error.

  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: API is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  status: { type: string, const: ok }
